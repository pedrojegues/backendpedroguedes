# ============================================================
# O semaforo
# ============================================================
# Roda a cada push. Pega os testes oficiais do repositorio de
# referencia do professor e roda contra o seu codigo.
# Voce nao precisa mexer neste arquivo.
# ============================================================

name: Testes da API

on: push

jobs:
  testar:
    # No proprio template o codigo esta vazio de proposito,
    # entao nao faz sentido rodar os testes aqui.
    if: github.repository != 'Srdiegoibs/backend-i-template'
    runs-on: ubuntu-latest
    steps:
      - name: Pega o codigo do aluno
        uses: actions/checkout@v4

      - name: Instala o Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instala as dependencias
        run: npm install

      - name: Baixa os testes oficiais
        uses: actions/checkout@v4
        with:
          repository: Srdiegoibs/backend-i-referencia
          path: .testes-oficiais

      - name: Roda os testes ate a aula declarada no arquivo AULA
        run: |
          node servidor.js > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for tentativa in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/treinos >/dev/null; then
              echo "Servidor disponivel em http://localhost:3000"
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat server.log
              echo "O servidor encerrou antes de ficar disponivel."
              exit 1
            fi
            sleep 1
          done

          if ! curl --silent --fail http://localhost:3000/treinos >/dev/null; then
            cat server.log
            echo "O servidor nao respondeu em http://localhost:3000 apos 30 segundos."
            exit 1
          fi

          kill "$SERVER_PID"
          wait "$SERVER_PID" || true
          trap - EXIT

          AULA=$(tr -d '[:space:]' < AULA)
          echo "Testando ate a aula $AULA"
          for n in $(seq 2 "$AULA"); do
            arquivo=$(printf ".testes-oficiais/testes/aula%02d.test.js" "$n")
            if [ -f "$arquivo" ]; then
              echo "--- aula $n ---"
              node --test "$arquivo"
            fi
          done
